name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API test runner
        run: npm install --global newman@6

      - name: Prepare shell scripts
        run: chmod +x scripts/*.sh

      - uses: docker/setup-buildx-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test services
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for svc in rating library reservation gateway; do
            (cd $svc && mvn -B -q test)
          done

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        timeout-minutes: 15
        run: ./scripts/test-script.sh
        env:
          VARIANT: v4
          SERVICE_NAME: rating
          PORT_NUMBER: 8050

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v